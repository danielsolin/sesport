# Merge this file with the image defaults.
# SearXNG 2026.6+ expects default settings such as
# `default_doi_resolver` to still exist.
use_default_settings: true

search:
  default_lang: all
  formats:
    - html
    - json

server:
  base_url: http://127.0.0.1:8088/
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "sesport-development-secret-key"
  limiter: false
  public_instance: false
  image_proxy: false

