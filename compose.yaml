services:
   postgres:
      profiles:
         - postgresql-searxng
      image: postgres:17
      container_name: sesport-postgres
      environment:
         POSTGRES_DB: ${SESPORT_POSTGRES_DB:-sesport}
         POSTGRES_USER: ${SESPORT_POSTGRES_USER:-sesport}
         POSTGRES_PASSWORD: ${SESPORT_POSTGRES_PASSWORD:-sesport}
      ports:
         - "207.2.120.181:${SESPORT_POSTGRES_PORT:-15285}:5432"
      volumes:
         - sesport-postgres:/var/lib/postgresql/data
         - ./database/migrations:/migrations:ro
      healthcheck:
         test:
            - CMD-SHELL
            - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
         interval: 5s
         timeout: 5s
         retries: 10
      restart: unless-stopped

   searxng:
      profiles:
         - postgresql-searxng
      image: docker.io/searxng/searxng:latest
      container_name: sesport-searxng
      ports:
         - "127.0.0.1:${SEARXNG_PORT:-8088}:8080"
      volumes:
         - ./searxng/core-config:/etc/searxng:ro
         - sesport-searxng:/var/cache/searxng
      restart: unless-stopped

volumes:
   sesport-postgres:
   sesport-searxng:
